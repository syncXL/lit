model:
  name: "omniASR_CTC_300M_v2" # omniASR_CTC_1B, omniASR_CTC_3B

dataset:
  name: "indonesian-javanese-set"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/kaggle/working/data/all_asr/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: True
  asr_task_config:
     max_audio_len: 640_000
     max_num_elements: 640_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 10_000 # full-batch shuffling by default

tokenizer:
  name: "omniASR_tokenizer_written_v2"

optimizer:
  config:
    lr: 1e-05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 16 # tune this parameter if you are getting OOM

regime:
  num_steps: 10_000
  validate_every_n_steps: 1000
  validate_after_n_steps: 1000
  checkpoint_every_n_steps: 1000
  checkpoint_after_n_steps: 1000
  publish_metrics_every_n_steps: 1000
  publish_metrics_after_n_steps: 1000
